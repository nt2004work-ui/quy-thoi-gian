<style>
/* ===== Cute Pop: bảng màu giống app thu chi (xanh dương, vàng, hồng, xanh lá, navy trên nền trắng ngà) ===== */
@font-face{font-family:'Be Vietnam Pro';font-weight:400;font-display:swap;src:url(fonts/be-vietnam-pro-vietnamese-400-normal.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}

@font-face{font-family:'Be Vietnam Pro';font-weight:700;font-display:swap;src:url(fonts/be-vietnam-pro-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --blue:#188FE4;--blue-strong:#0F70BA;--blue-ink:#0B67B0;--blue-tint:#E6F2FC;
  --yellow:#FFDE00;--yellow-ink:#6B5800;--yellow-tint:#FFF6BF;
  --pink:#F45AA5;--pink-light:#F8A4B3;--pink-ink:#B81C6E;--pink-tint:#FDE7EE;
  --green:#278454;--green-ink:#1E6B45;--green-tint:#E5F3EC;
  --coral-strong:#C93A27;--coral-ink:#B83220;
  --ink:#14284B;--bg:#FFFBF6;--surface:#fff;--muted:#5B6479;--border:#F1E3E7;--border-strong:#8B93A7;
  --shadow:0 1px 2px rgb(20 40 75/.05),0 4px 14px rgb(20 40 75/.06);

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
header{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px;padding-top:env(safe-area-inset-top)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:46px;height:46px;flex:none}
h1{font-size:20px;margin:0;color:var(--blue-ink)}h2{font-size:16px;margin:0 0 12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card.tint-y{background:var(--yellow-tint);border-color:#F3E48A}
.card.tint-p{background:var(--pink-tint)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>label{min-width:130px}
label{display:flex;flex-direction:column;font-size:12px;font-weight:500;color:var(--muted);gap:4px;flex:1;min-width:0}
input,select{font:inherit;font-size:16px;padding:10px 12px;min-height:44px;border:1.5px solid var(--border-strong);border-radius:14px;background:#fff;color:var(--ink);width:100%}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--green)}
button{font:inherit;color:inherit}

button.b:active{transform:scale(.96)}

button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue-ink);outline-offset:2px}
/* Form: lưới 2 cột, không bao giờ rộng hơn màn hình */

.form .wide,.form .act{grid-column:1/-1}.form .gap{display:none}

/* Ô ngày/giờ/tháng trên iOS và Android hay rộng hơn khung: ép về đúng bề rộng */

input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value,input[type=month]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
input::-webkit-calendar-picker-indicator{margin:0 0 0 4px;flex:none}
.daynav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.daynav input{flex:1;min-width:140px;width:auto}.daynav .b{padding:10px 14px}

.days{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

.al{gap:6px}.al .aln{flex:2;min-width:0}.al .ala{flex:1;min-width:90px;text-align:right}
header input[type=month]{width:auto;min-width:150px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.k{font-size:12px;color:var(--muted)}.v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.money{color:var(--green-ink)}.big{font-size:30px}
.li{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--border);align-items:center}
.li:first-child{border-top:0}.li small{color:var(--muted)}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:9999px;padding:1px 8px;margin-right:6px;vertical-align:1px}
.chip.main{background:var(--blue-tint);color:var(--blue-ink)}.chip.side{background:var(--pink-tint);color:var(--pink-ink)}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:22px;min-width:44px;min-height:44px;border-radius:9999px}
.x:hover{background:var(--pink-tint);color:var(--coral-ink)}
.bar{height:10px;border-radius:9999px;background:var(--border);overflow:hidden;min-width:70px;margin-top:4px}
.bar i{display:block;height:100%;background:var(--green);border-radius:9999px;transition:width .3s}
.bar.y i{background:var(--yellow)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 4px;text-align:right;border-top:1px solid var(--border)}th{color:var(--muted);font-weight:500;border-top:0}
th:first-child,td:first-child{text-align:left}
.tbl{overflow-x:auto}
.empty{color:var(--muted);padding:6px 0;text-align:center}
.empty svg{width:84px;height:84px;display:block;margin:4px auto 6px}
.done{text-decoration:line-through;color:var(--muted)}
.plan-lbl{flex-direction:row!important;align-items:center;gap:10px!important;font-size:15px!important;color:var(--ink)!important;font-weight:400!important;min-height:44px}
/* điều hướng dưới (kiểu app) */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--border);box-shadow:0 -4px 16px rgb(20 40 75/.06);padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:760px;margin:0 auto;display:flex}
nav button{flex:1;background:none;border:0;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11px;font-weight:500;cursor:pointer}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--blue-ink);font-weight:700}
nav button.on span{background:var(--blue-tint);border-radius:9999px;padding:2px 16px}
nav button span{display:flex;padding:2px 16px}
/* đăng nhập */
#auth{max-width:380px;margin:8vh auto;text-align:center}
#auth label{text-align:left;margin-bottom:12px}
#auth svg.hero{width:110px;height:110px;margin:0 auto 4px;display:block}
#auth .row{justify-content:center}
.banner{background:var(--yellow-tint);border:1px solid #F3E48A;color:var(--yellow-ink);border-radius:14px;padding:8px 12px;margin-bottom:12px;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:9999px;font-size:14px;z-index:9;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="wrap" id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
// ====== ĐIỀN THÔNG TIN SUPABASE CỦA BẠN (Project Settings > API) ======
const SUPABASE_URL = 'https://basqziudrfpapodhiivl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_3S-X4DkwNTdJECq-1xruQA_0i3RT5aD';
// =====================================================================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vnd = n => Math.round(n || 0).toLocaleString('vi-VN') + ' ₫';
const hm = m => Math.floor(m / 60) + 'g' + String(Math.round(m % 60)).padStart(2, '0');
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);

let user, tab = 'today', month = today().slice(0, 7), E = [], P = [], A = [], offline = false, noAllow = false, needMig = false, day = today();
let S = { monthly_salary: 0, work_days: 22, hours_per_day: 8, deduction_pct: 10 };
const rate = () => S.monthly_salary / (S.work_days * S.hours_per_day) || 0;
localStorage.removeItem('timer'); // dọn phiên bấm giờ của bản cũ

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 3200);
}
// Chạy một thao tác ghi; báo lỗi rõ ràng (hết mạng, lỗi máy chủ). Trả về true nếu thành công.
const colMissing = e => e && (e.code === '42703' || e.code === 'PGRST204' || /column/i.test(e.message || ''));
async function write(op, fallback) {
  if (!navigator.onLine) { toast('Đang ngoại tuyến: cần có mạng để lưu thay đổi.'); return false; }
  try {
    let { error } = await op();
    // Thiếu cột (chưa chạy file SQL cập nhật): thử lại với dữ liệu không có cột mới.
    if (error && fallback && colMissing(error)) { needMig = true; ({ error } = await fallback()); }
    if (error) { toast('Không lưu được: ' + error.message); return false; }
    return true;
  } catch (e) { toast('Không kết nối được máy chủ. Thử lại sau.'); return false; }
}

// ---------- Mèo (SVG nội bộ, tô phẳng) ----------
function cat(mood = 'happy', fur = '#FFDE00', dark = '#E8A700') {
  const eyes = mood === 'sleep'
    ? '<g fill="none" stroke="#14284B" stroke-width="2.6" stroke-linecap="round"><path d="M31 43 Q37 49 43 43"/><path d="M57 43 Q63 49 69 43"/></g><g fill="none" stroke="#14284B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M76 18h7l-7 8h7"/><path d="M87 6h5l-5 6h5"/></g>'
    : mood === 'happy'
    ? '<g fill="none" stroke="#14284B" stroke-width="2.6" stroke-linecap="round"><path d="M31 46 Q37 38 43 46"/><path d="M57 46 Q63 38 69 46"/></g>'
    : '<circle cx="37" cy="44" r="7" fill="#fff"/><circle cx="63" cy="44" r="7" fill="#fff"/><circle cx="38" cy="46" r="3.4" fill="#14284B"/><circle cx="62" cy="46" r="3.4" fill="#14284B"/>';
  const mouth = mood === 'happy' ? '<path d="M42 55 Q50 68 58 55Z" fill="#D9432E"/>'
    : '<path d="M50 54.5v2M50 56.5q-3.4 3.6-6.4.4M50 56.5q3.4 3.6 6.4.4" fill="none" stroke="#14284B" stroke-width="2" stroke-linecap="round"/>';
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M72 88Q94 88 90 66Q89 60 83 63" fill="none" stroke="${fur}" stroke-width="7" stroke-linecap="round"/><path d="M24 100Q24 70 50 70Q76 70 76 100Z" fill="${fur}"/>
  <path d="M21 40L23 12Q24 9 27 11L46 24Z" fill="${fur}"/><path d="M79 40L77 12Q76 9 73 11L54 24Z" fill="${fur}"/>
  <path d="M27 31L27.6 18L38 25.4Z" fill="${dark}"/><path d="M73 31L72.4 18L62 25.4Z" fill="${dark}"/>
  <path d="M18 46C18 28 33 19 50 19C67 19 82 28 82 46C82 63 67 72 50 72C33 72 18 63 18 46Z" fill="${fur}"/>
  <g fill="none" stroke="${dark}" stroke-width="2.4" stroke-linecap="round"><path d="M44 24q3-2 6 0q3 2 6 0"/><path d="M21 50q3-2 6 0q3 2 6 0"/><path d="M67 50q3-2 6 0q3 2 6 0"/></g>
  <circle cx="29" cy="56" r="4.6" fill="#F8A4B3" opacity=".75"/><circle cx="71" cy="56" r="4.6" fill="#F8A4B3" opacity=".75"/>${eyes}
  <path d="M47.4 50.6h5.2q-.3 2.8-2.6 3.4q-2.3-.6-2.6-3.4z" fill="#F45AA5"/>${mouth}</svg>`;
}
const empty = (msg, mood = 'sleep', fur, dark) => `<div class="empty">${cat(mood, fur, dark)}${msg}</div>`;

// Tổng các khoản phụ cấp mỗi ngày (₫/ngày).
const allowPerDay = () => A.reduce((t, a) => t + (+a.amount || 0), 0);
// minutes đã là số phút THỰC LÀM (đã trừ giờ nghỉ). Phụ cấp tính cho mỗi ngày có ghi giờ việc chính, không bị khấu trừ.
function stats(list) {
  let mm = 0, sm = 0, si = 0, br = 0;
  const days = new Set();
  list.forEach(e => {
    br += e.break_minutes || 0;
    if (e.kind === 'main') { mm += e.minutes; days.add(e.work_date); } else { sm += e.minutes; si += +e.income || 0; }
  });
  const gross = mm / 60 * rate(), net = gross * (1 - S.deduction_pct / 100), allow = allowPerDay() * days.size;
  return { mm, sm, si, br, days: days.size, gross, net, allow, total: net + si + allow, prod: (mm + sm) / (S.hours_per_day * 60) * 100 };
}

// ---------- Đăng nhập ----------
function authView() {
  $('#app').innerHTML = `<form id="auth" class="card" onsubmit="auth('in');return false">${cat('happy')}<h1>Quỹ thời gian</h1>
  <p class="k">Đăng nhập một lần, dữ liệu lưu trên Supabase của bạn.</p>
  <label>Email<input id="em" type="email" autocomplete="email" required></label>
  <label>Mật khẩu (≥ 6 ký tự)<input id="pw" type="password" autocomplete="current-password" minlength="6" required></label>
  <div class="row"><button class="b" type="submit">Đăng nhập</button><button class="b g" type="button" onclick="auth('up')">Tạo tài khoản</button></div></form>`;
  $('#auth svg').classList.add('hero');
}
async function auth(mode) {
  const c = { email: $('#em').value.trim(), password: $('#pw').value };
  if (!c.email || c.password.length < 6) return toast('Nhập email và mật khẩu (≥ 6 ký tự).');
  try {
    const { error } = mode === 'in' ? await sb.auth.signInWithPassword(c) : await sb.auth.signUp(c);
    if (error) toast(error.message); else if (mode === 'up') toast('Đã tạo tài khoản. Nếu Supabase bật xác nhận email, hãy kiểm tra hộp thư rồi đăng nhập.');
  } catch (e) { toast('Không kết nối được máy chủ.'); }
}

// ---------- Dữ liệu (có bản đọc ngoại tuyến) ----------
const cacheKey = () => `cache:${user?.id}:${month}`;
async function load() {
  const [y, m] = month.split('-'), a = month + '-01', b = `${month}-${new Date(y, m, 0).getDate()}`;
  try {
    if (!navigator.onLine) throw new Error('offline');
    const s = await sb.from('settings').select('*').maybeSingle();
    const e = await sb.from('entries').select('*').gte('work_date', a).lte('work_date', b).order('work_date', { ascending: false }).order('created_at', { ascending: false });
    const p = await sb.from('plans').select('*').gte('plan_date', a).lte('plan_date', b).order('plan_date');
    const al = await sb.from('allowances').select('*').order('created_at');
    if (s.error || e.error || p.error) throw new Error((s.error || e.error || p.error).message);
    const mg = await sb.from('plans').select('at_time,extra').limit(1);
    const mg2 = await sb.from('entries').select('break_minutes').limit(1);
    needMig = !!mg.error || !!mg2.error || !!al.error;
    noAllow = !!al.error; // bảng phụ cấp chưa tạo: app vẫn chạy, mục Phụ cấp báo cần chạy SQL
    if (s.data) S = s.data;
    E = e.data || []; P = p.data || []; A = al.data || []; offline = false;
    saveCache();
  } catch (err) {
    const c = JSON.parse(localStorage.getItem(cacheKey()) || 'null');
    offline = true;
    if (c) { ({ S, E, P } = c); A = c.A || []; } else { E = []; P = []; }
  }
  render();
}
function saveCache() { try { localStorage.setItem(cacheKey(), JSON.stringify({ S, E, P, A })); } catch (_) {} }
async function saveS() {

  if (n.work_days < 1 || n.hours_per_day < 1 || n.deduction_pct < 0 || n.deduction_pct > 100 || n.monthly_salary < 0) return toast('Kiểm tra lại các con số.');

// "HH:MM" -> phút trong ngày
const toMin = v => { const p = String(v || '').split(':'); return p.length === 2 && p[0] !== '' && p[1] !== '' ? +p[0] * 60 + +p[1] : NaN; };
// Số phút giữa giờ vào và giờ ra; ra về sau nửa đêm (ra < vào) thì cộng thêm 24 giờ.
const span = (a, b) => { const x = toMin(a), y = toMin(b); return isNaN(x) || isNaN(y) ? NaN : (y - x + 1440) % 1440; };

function setNow(id, kind) { $('#' + id).value = nowHM(); preview(kind); }
// Giờ nghỉ nhập theo tiếng (có thể lẻ: 0.5, 1.25) -> phút.
const brkMin = kind => Math.round((+$('#brk' + kind).value || 0) * 60);
function preview(kind) {
  const total = span($('#in' + kind).value, $('#out' + kind).value), b = brkMin(kind), m = total - b, el = $('#pv' + kind);
  if (!el) return;
  el.textContent = !(total > 0) ? '' : m > 0
    ? 'Làm ' + hm(m) + (b ? ' (đã trừ nghỉ ' + hm(b) + ')' : '') + (kind === 'main' ? ' · ' + vnd(m / 60 * rate()) : '')
    : 'Giờ nghỉ phải ngắn hơn ca làm';
}
async function add(kind) {
  const t = $('#t' + kind).value.trim() || (kind === 'main' ? 'Làm việc chính' : ''), d = $('#d' + kind).value;
  const total = span($('#in' + kind).value, $('#out' + kind).value), b = brkMin(kind), m = total - b;
  if (!t) return toast('Nhập tên công việc.');
  if (!d || !(total > 0)) return toast('Nhập ngày, giờ vào và giờ ra.');
  if (b < 0) return toast('Giờ nghỉ không được âm.');
  if (!(m > 0)) return toast('Giờ nghỉ phải ngắn hơn ca làm.');
  const row = { kind, title: t, work_date: d, minutes: m, break_minutes: b, income: kind === 'side' ? +$('#i' + kind).value || 0 : null };
  const { break_minutes, ...basic } = row; // minutes đã trừ giờ nghỉ nên lương vẫn đúng dù thiếu cột
  if (await write(() => sb.from('entries').insert(row), () => sb.from('entries').insert(basic))) {
    if (kind === 'main') localStorage.setItem('lastBrk', $('#brk' + kind).value || '0'); // lần sau tự điền sẵn
    toast('Đã lưu ' + hm(m) + (b ? ' (nghỉ ' + hm(b) + ')' : '') + '.'); load();
  }
}

async function updPlan(id, field, v) {

    ${offline ? '<div class="banner">Đang ngoại tuyến: hiển thị dữ liệu đã lưu lần trước. Cần có mạng để thêm, sửa hoặc xóa.</div>' : ''}
    ${tabs[tab][1]()}
    <nav aria-label="Điều hướng"><div>${Object.entries(tabs).map(([k, v]) => `<button class="${k === tab ? 'on' : ''}" ${k === tab ? 'aria-current="page"' : ''} onclick="tab='${k}';render();scrollTo(0,0)"><span><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg></span>${v[0]}</button>`).join('')}</div></nav>`;
}
async function signOut() { if (confirm('Đăng xuất khỏi thiết bị này?')) await sb.auth.signOut(); }

// ---------- Khởi động ----------
addEventListener('online', () => user && load());
addEventListener('offline', () => { offline = true; user && render(); });
let lastUid;
sb.auth.onAuthStateChange((ev, session) => {
  user = session?.user;
  if (!user) { lastUid = null; return authView(); }
  // Làm mới token cũng bắn sự kiện: chỉ tải lại dữ liệu khi đổi người dùng.
  if (user.id !== lastUid) { lastUid = user.id; load(); }
});
authView();
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
